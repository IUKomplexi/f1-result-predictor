# f1-result-predictor configuration — everything here is an OVERRIDE.
#
# The built-in defaults live in f1core/config.py (DEFAULTS); load_config
# merges this file over them, so an absent key falls back to the code
# default. CLI flags override config values, and the dashboard's Settings
# tab writes the full effective config back here via save_config.
#
# Overridable sections: [api] [data] [model] [model.params] [report]
# [features]. Examples:
#
#   [data]
#   start_season = 2012
#   end_season = 2025
#
#   [model.params]
#   max_iter = 600

[features]
# Feature selection (see features/registry.py).
# The registry defaults (core features on, selectable/cut off) apply when
# this is absent. Uncomment + edit the list to override; CLI flags
# --enable-features/--disable-features apply on top.
# enabled = ["grid", "qual_pos", "driver_id", "constructor_id", "circuit_id"]
