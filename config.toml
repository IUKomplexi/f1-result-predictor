# f1-result-predictor configuration.
# Every value here is optional: the built-in defaults in config.py already
# match this file. CLI flags override config values.

[api]
base_url = "https://api.jolpi.ca/ergast/f1"
# The Jolpica API terms of use require a descriptive User-Agent.
user_agent = "f1-result-predictor/0.1.0 (https://github.com/example/f1-result-predictor; contact: dev@example.com)"
sleep_seconds = 0.25
timeout = 30.0
max_retries = 3

[data]
cache_dir = "data/raw"
dataset = "data/features.parquet"
start_season = 2010
end_season = 2025

[model]
checkpoint = "data/model/hurdle.joblib"
calibrators = "data/model/calibrators.joblib"
seed = 42

[report]
backtest = "reports/backtest.md"
prediction = "reports/prediction.md"

[features]
# Feature selection (see features/registry.py + reports/features.md).
# The explicit list below mirrors the registry defaults (core features on,
# selectable/cut off). Remove the line to fall back to registry defaults, or
# edit the list to override; CLI flags --enable-features/--disable-features
# apply on top.
enabled = ["grid", "qual_pos", "grid_qual_gap", "driver_prev_points_mean",
           "driver_prev_points_sum", "team_prev_points_mean", "team_wins_prior",
           "champ_points_entering", "constructor_champ_pos_entering",
           "season_driver_pts_per_race", "season_team_pts_per_race",
           "driver_id", "constructor_id", "circuit_id"]

[weather]
cache_dir = "data/weather"
