[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-result-predictor"
version = "0.1.0"
description = "Predict F1 race points per driver from pre-race features using a zero-inflated hurdle model (Jolpica API data)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14.0",  # parquet engine for the dataset cache (config [data] dataset)
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]  # fastapi+httpx: FastAPI TestClient
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
lint = ["ruff>=0.8"]

[project.scripts]
f1 = "f1core.cli:main"

[tool.setuptools]
packages = ["f1core", "f1data", "features", "model", "f1web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeprecationWarnings are errors so the suite cannot silently accrue
# deprecation debt (the joblib/numpy 2.5 warning is suppressed at the
# checkpoint I/O sites in model/train.py).
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "PIE", "ISC", "BLE"]
