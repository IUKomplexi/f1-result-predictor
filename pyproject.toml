[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-result-predictor"
version = "0.1.0"
description = "Predict F1 race points per driver from pre-race features using a zero-inflated hurdle model (Jolpica API data)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
f1-predict = "predict:main"
f1-train = "model.train:main"
f1-backtest = "model.evaluate:main"
f1-calibrate = "model.calibrate:main"
f1-search = "model.search:main"

[tool.setuptools]
packages = ["f1data", "features", "model"]
py-modules = ["predict", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
