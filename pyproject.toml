[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-result-predictor"
version = "0.1.0"
description = "Predict F1 race points per driver from pre-race features using a zero-inflated hurdle model (Jolpica API data)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14.0",  # parquet engine for the dataset cache (config [data] dataset)
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "flask>=3.0"]  # flask: tests/test_webapp.py imports f1web
web = ["flask>=3.0"]
lint = ["ruff>=0.8", "pyright>=1.1.390"]

[project.scripts]
f1-predict = "predict:main"
f1-train = "model.train:main"
f1-backtest = "model.evaluate:main"
f1-calibrate = "model.calibrate:main"
f1-search = "model.search:main"
f1-web = "f1web.app:main"

[tool.setuptools]
packages = ["f1data", "features", "model", "f1web", "f1weather"]
py-modules = ["predict", "config", "reporting", "httpclient"]

[tool.setuptools.package-data]
f1web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeprecationWarnings are errors so the suite cannot silently accrue
# deprecation debt (the joblib/numpy 2.5 warning is suppressed at the
# checkpoint I/O sites in model/train.py).
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "PIE", "ISC", "BLE"]
