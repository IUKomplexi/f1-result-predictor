name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras --frozen
      - name: Run tests
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --frozen
      - name: Lint (ruff)
        run: uv run ruff check .

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: f1web/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint (oxlint)
        run: npm run lint
