services:
  web:
    build: .
    image: f1-result-predictor
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      # Settings edits (Settings tab / PUT /api/config) survive rebuilds —
      # config.toml is the single source of truth shared with the CLI.
      - ./config.toml:/app/config.toml
      # Fetched raw data, the featured dataset, model checkpoints and the
      # prediction cache survive rebuilds; the baked-in data/ files
      # initialize this on first use.
      - data:/app/data
      # Runtime-generated snapshots (backtest/calibration JSON) survive
      # rebuilds; the baked-in reports/ files initialize this on first use.
      - reports:/app/reports
    logging:
      # Bound the container's log growth (uvicorn access logs can be chatty).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  reports:
